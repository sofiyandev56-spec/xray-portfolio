<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autograph preview</title>
    <!--
      Development-only preview of the stroke-by-stroke autograph. Not part of the
      site build. With `npm run dev` running, open /tools/signature/preview.html.
      ?ink=autograph|signature picks what to write; ?speed=1.5 changes pace.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background-color: #14337a;
        background-image:
          linear-gradient(rgba(159, 178, 214, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(159, 178, 214, 0.16) 1px, transparent 1px);
        background-size: 48px 48px;
        font: 15px/1.4 system-ui, sans-serif;
        color: #e8ecf1;
      }
      .stage {
        width: min(86vw, 1150px);
        color: #ffb400;
      }
      .signature svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      button {
        position: fixed;
        left: 24px;
        bottom: 24px;
        padding: 10px 18px;
        border: 1px solid rgba(232, 236, 241, 0.5);
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #ffb400;
        color: #ffb400;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="signature" data-signature data-ink="autograph"></div>
    </div>
    <button type="button" id="replay">Replay</button>

    <script type="module">
      import { signatureTimeline } from '/src/motion/signature.js'

      const params = new URLSearchParams(location.search)
      const host = document.querySelector('.signature')
      host.dataset.ink = params.get('ink') || 'autograph'
      const tl = signatureTimeline(host, { speed: Number(params.get('speed')) || 1 })
      tl.repeat(-1).repeatDelay(1.4).play()
      window.__autograph = tl
      document.getElementById('replay').addEventListener('click', () => tl.restart())
    </script>
  </body>
</html>
